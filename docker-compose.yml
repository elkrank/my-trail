services:
  app:
    build: ./app
    environment:
      PORT: 3000
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scraper:
    build: ./app
    entrypoint: ["npm", "run"]
    command: ["scrape"]
    volumes:
      - ./app/data:/app/data
